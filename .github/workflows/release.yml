name: Release

# Release flow
#  1. Release Please maintains a release pull request (version bump in package.json, lock file and
#     plugin.json, CHANGELOG). Pull requests created with GITHUB_TOKEN do not trigger other
#     workflows, so this workflow starts CI on the release branch explicitly via workflow_dispatch
#     (which GITHUB_TOKEN may trigger); its "CI passed" check gates the merge.
#  2. Merging the release pull request makes Release Please create the tag and a *draft* release.
#  3. Everything else runs inside this workflow (no tag/release event chaining): the full CI suite
#     runs against the tag, then the plugin is built and packaged reproducibly, assets, checksums
#     and SBOM are attached, the `stable` branch served by the marketplace is updated to
#     tag + build, the release is published, and the published plugin is installed and verified.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Re-run publishing for an existing draft release (e.g. v0.1.0)
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI on the release pull request
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          branch="$(jq -r '.headBranchName' <<< "${PR_JSON}")"
          echo "Dispatching CI for ${branch}"
          gh workflow run ci.yml --repo "${REPO}" --ref "${branch}"

  resolve:
    name: Resolve release
    needs: [release-please]
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Draft releases are only visible to tokens with write access to contents.
      contents: write
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - id: r
        env:
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag="${RP_TAG:-${INPUT_TAG}}"
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag: ${tag}"; exit 1
          fi
          draft="$(gh release view "${tag}" --repo "${REPO}" --json isDraft --jq .isDraft)"
          if [[ "${draft}" != "true" ]]; then
            echo "Release ${tag} is not a draft; refusing to publish it twice."; exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify tagged commit
    needs: [resolve]
    # The skipped release-please job (manual runs) would otherwise skip the whole chain.
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- the "./" form is the documented syntax for local reusable workflows
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  publish:
    name: Build, package and publish
    needs: [resolve, verify]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Check version consistency
        run: |
          test "$(jq -r .version package.json)" = "${VERSION}"
          test "$(jq -r .version plugin/.claude-plugin/plugin.json)" = "${VERSION}"
          test "$(jq -r '.["."]' .release-please-manifest.json)" = "${VERSION}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${TAG}")"
      - name: Build
        run: npm run build
      - name: Package plugin, source archive, SBOM and checksums
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix="claude-code-gitea-${VERSION}/" \
            -o "release/claude-code-gitea-${VERSION}-source.tar.gz" "${TAG}"
          npm sbom --omit dev --sbom-format cyclonedx > "release/claude-code-gitea-${VERSION}.cdx.json"
          node scripts/package-plugin.mjs release
          ls -l release
      - name: Smoke test the packaged plugin
        run: |
          mkdir -p pkg && unzip -q "release/gitea-plugin-${VERSION}.zip" -d pkg
          npm run smoke -- pkg/gitea/dist/server.mjs
      - name: Attach assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" release/* --repo "${REPO}" --clobber
      - name: Update the stable branch (plugin directory of the tag + built bundle)
        # `stable` is a distribution branch with its own linear history. Each commit contains only
        # the plugin/ directory of the release tag plus the built server, so it never carries
        # workflow files (which GITHUB_TOKEN may not push) and needs no force push.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          gitauth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}")
          remote="https://github.com/${REPO}.git"
          parent=()
          if git "${gitauth[@]}" fetch --quiet "${remote}" stable 2>/dev/null; then
            parent=(-p FETCH_HEAD)
          fi
          GIT_INDEX_FILE="$(mktemp -u)"
          export GIT_INDEX_FILE
          git read-tree --empty
          git add --force plugin
          {
            echo "# stable (generated)"
            echo
            echo "Distribution branch served by the Claude Code marketplace in this repository."
            echo "It contains the plugin/ directory of release ${TAG} plus the built MCP server."
            echo "Sources and history: https://github.com/${REPO}/tree/${TAG}"
          } > STABLE.md
          git add --force STABLE.md
          tree="$(git write-tree)"
          tag_sha="$(git rev-parse "${TAG}^{commit}")"
          commit="$(git commit-tree "${tree}" "${parent[@]}" -m "release: ${TAG}" \
            -m "Plugin directory of ${TAG} (${tag_sha}) plus plugin/dist/server.mjs.")"
          unset GIT_INDEX_FILE
          git "${gitauth[@]}" push "${remote}" "${commit}:refs/heads/stable"
          echo "stable -> ${commit}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease="false"
          [[ "${VERSION}" == *-* ]] && prerelease="true"
          gh release edit "${TAG}" --repo "${REPO}" --draft=false --prerelease="${prerelease}" --latest="$([[ ${prerelease} == true ]] && echo false || echo true)"
          gh release view "${TAG}" --repo "${REPO}"

  verify-install:
    name: Verify installation
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml # zizmor: ignore[self-repository] -- the "./" form is the documented syntax for local reusable workflows
    with:
      tag: ${{ needs.resolve.outputs.tag }}

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      runtime:
        dependency-type: production
      development:
        dependency-type: development
        update-types: [minor, patch]
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /ci-tools
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
    cooldown:
      default-days: 7

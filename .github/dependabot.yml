version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      runtime:
        dependency-type: production
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types must match the oldest supported Node.js major (engines: >=22.19).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript < 6.1; lift once it supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /ci-tools
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
    cooldown:
      default-days: 7
